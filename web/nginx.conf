server {
    listen 80;
    server_name _;

    return 301 https://$host:4200$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/nginx/certs/localhost.pem;
    ssl_certificate_key /etc/nginx/certs/localhost-key.pem;

    location / {
        try_files $uri $uri/ /index.html;
    }
}