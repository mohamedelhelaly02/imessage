name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  api:
    name: API (build, test, docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Api.Tests/Api.Tests.csproj

      - name: Build
        run: dotnet build Api.Tests/Api.Tests.csproj --no-restore -c Release

      - name: Test
        run: dotnet test Api.Tests/Api.Tests.csproj --no-build -c Release --verbosity normal

      - name: Docker build (no push)
        run: docker build -t imessage-api:ci Api

  web:
    name: Web (build, docker)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Docker build (no push)
        run: docker build -t imessage-web:ci .

  push-images:
    name: Push images to Docker Hub
    needs: [api, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: Api
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/imessage-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/imessage-api:${{ github.sha }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/imessage-web:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/imessage-web:${{ github.sha }}

